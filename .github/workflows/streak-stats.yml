
name: Generate GitHub Streak

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: generate-github-streak
  cancel-in-progress: false

jobs:
  generate-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=nava-07&theme=tokyonight&hide_border=true&timezone=Asia/Kolkata
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak SVG
        run: |
          mkdir -p profile

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub streak"
            git push
          else
            echo "No streak changes to commit."
          fi
